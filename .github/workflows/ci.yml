# Checks that run on every push to main and on every pull request.
#
# No step calls a model: OFFEROWL_LLM is none for the whole run, and the CLI tests use stand-ins.
# Everything here can be run by hand with the same commands (see docs/USAGE.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository.
permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  OFFEROWL_LLM: none  # the backend "none": run() raises LLMUnavailable instead of calling anything
  OFFEROWL_LLM_LOG: /tmp/offerowl-ci-calls.jsonl  # the stand-ins' calls in a log of the run, never the engine's own output/_llm
  OFFEROWL_LANG: en  # messages in English, so a log reads the same everywhere

jobs:
  lint-and-cli-tests:
    # Quick: a few seconds of work after the tools are installed. Run on every Python the package claims (pyproject.toml's
    # classifiers, 3.10 to 3.15): a module or method one of them drops (3.15 dropped load_module()) fails here first.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22  # the same major version as the render image, so `node --check` reads the code the way the image does
      - name: Install the lint tool, and the PDF reader the tests compare with poppler (PDFium draws pages through Pillow)
        run: python3 -m pip install flake8 pypdfium2==5.14.0 'pillow==13.0.0; python_version >= "3.11"' 'pillow==12.3.0; python_version < "3.11"'
      - name: The typesetting libraries, which the panel's tests draw the deck and its figures with
        run: npm ci
      - name: Syntax and lint (Python, JSON, JavaScript, shell)
        # --require-tools: a tool that is missing on the runner fails the step instead of being skipped.
        run: python3 tests/cli/lint.py --require-tools
      - name: CLI tests (help, llm, init, settings, stand-in backends, run.sh, messages)
        run: python3 -m unittest discover -s tests/cli -v
      - name: Drafting, cover letters, the interview kit, decision backends (stand-in models only)
        run: |
          python3 -m unittest discover -s tests/write -v
          python3 -m unittest discover -s tests/cover -v
          python3 -m unittest discover -s tests/interview -v
          python3 -m unittest discover -s tests/decide -v
      - name: The renderer's rules, and the panel's API on the fictional example
        run: python3 -m unittest tests/render/test_render.py tests/render/test_pdftools.py tests/render/test_blind_figures.py tests/render/test_office.py tests/app/test_panel.py tests/app/test_choices.py tests/app/test_draft.py tests/app/test_materials.py tests/app/test_talk_api.py tests/app/test_removed.py tests/app/test_blind.py tests/app/test_deck_source.py tests/app/test_delivery.py tests/app/test_agent_usage.py tests/app/test_ask.py tests/app/test_autopilot.py tests/app/test_insights_library.py tests/app/test_kit_proxy.py tests/app/test_mcp.py tests/app/test_state_cost.py tests/app/test_static_css.py -v

  selftest:
    # Slow: the first run builds the render image (LibreOffice, Chromium, Tesseract), then typesets the fictional example,
    # checks it, plants a defect and reads a scan.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the typesetting libraries (the only step that needs the network)
        run: OFFEROWL_NET=1 render/run.sh npm ci
      - name: Self-test with backend none
        run: ./offerowl selftest
      - name: Every part of the resume and the deck, on the full example
        run: python3 tests/parts/run.py
      - name: The deck's figure library
        run: python3 tests/deck/run.py

  # ---- Packaging: the files that install Offerowl (deploy/, pyproject.toml, .github/workflows/, docs/INSTALL.md) ----

  packaging:
    # Quick: nothing is built here except a wheel. The chart is rendered, the manifests and the workflows are validated,
    # and tests/packaging checks the package, the image's recipe, the chart, the workflows and the install guide.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OFFEROWL_REQUIRE_TOOLS: "1"  # a tool that is missing on the runner fails a test instead of skipping it
      OFFEROWL_REQUIRE_HOOKS: "1"  # so does a hook the image, the chart or the install guide needs in the panel or the launcher (tests/packaging/test_hooks.py)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test tools
        run: python3 -m pip install pyyaml setuptools
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.4
      - name: kubeconform and actionlint, checked against the checksums of their releases
        run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  /tmp/kubeconform.tar.gz" | sha256sum -c -
          curl -fsSL -o /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
          sudo tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint
      - name: Helm chart, lint and render with each AI choice
        run: |
          helm lint deploy/helm/offerowl
          helm template offerowl deploy/helm/offerowl > /tmp/rendered-default.yaml
          helm template offerowl deploy/helm/offerowl --set ai.backend=openai-compat --set ai.url=http://models.example.invalid:11434 --set ai.model=m > /tmp/rendered-local-model.yaml
          helm template offerowl deploy/helm/offerowl --set ingress.enabled=true --set persistence.enabled=false > /tmp/rendered-ingress.yaml
          kubeconform -strict -ignore-missing-schemas -summary /tmp/rendered-*.yaml
      - name: Workflows, with actionlint
        run: actionlint
      - name: Compose file of the app image is valid
        run: docker compose -f deploy/docker/compose.yaml config --quiet
      - name: Packaging tests
        run: python3 -m unittest discover -s tests/packaging -v

  package-install:
    # `pip install .` in a clean virtual environment on each system: the command starts, the doctor runs, and the
    # installed engine is complete (the app's own check starts the panel and reads a file through the engine).
    name: pip install on ${{ matrix.os }} with Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ["3.10", "3.15"]  # the oldest and the newest Python the package claims
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      OFFEROWL_LLM: none
      OFFEROWL_LANG: en
      PYTHONUTF8: "1"  # the engine prints Korean and English; a Windows console code page fails on either
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package in a clean virtual environment
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/venv"
          if [ -d "${RUNNER_TEMP}/venv/Scripts" ]; then BIN="${RUNNER_TEMP}/venv/Scripts"; else BIN="${RUNNER_TEMP}/venv/bin"; fi
          echo "${BIN}" >> "$GITHUB_PATH"
          "${BIN}/python" -m pip install .
      - name: offerowl --help
        run: offerowl --help
      - name: offerowl doctor (a FAIL line is expected, since the runner has no typesetting libraries; the JSON must still be valid)
        shell: bash
        run: |
          offerowl doctor || test $? -eq 1
          offerowl doctor --json > doctor.json || test $? -eq 1
          python -c "import json; d = json.load(open('doctor.json')); assert d['checks'], d"
      - name: The installed engine is complete (the app's own check)
        run: python -c "from offerowl.cli import app_main; raise SystemExit(app_main(['--check']))"

  app-image:
    # The app image built from this commit and started the way compose.yaml starts it (tests/packaging/image_smoke.sh):
    # health check, non-root user, read-only root filesystem, SIGTERM, data volume, and the self-test inside it.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: App image, loaded into this runner's Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          load: true
          tags: offerowl-app:ci
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Start it and check it
        run: tests/packaging/image_smoke.sh offerowl-app:ci --selftest
      - name: The same image with no network at all (docs/OFFLINE.md)
        run: tests/packaging/offline_e2e.sh offerowl-app:ci
