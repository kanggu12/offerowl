# The Helm chart on a throwaway kind cluster, with the app image built from this commit (tests/packaging/chart_e2e.sh):
# what only a running cluster shows, such as the probes and the Host header they send, the non-root user on a read-only
# filesystem, a setting that survives a replaced pod, the chart's AI values reaching the panel, and helm test.
# It runs when the chart, the image or the code inside it changes, and by hand. No model is called.
name: chart-e2e

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "apps/**"
      - "src/**"
      - "core/**"
      - "package.json"
      - "package-lock.json"
      - "tests/packaging/chart_e2e.sh"
      - ".github/workflows/chart-e2e.yml"
  workflow_dispatch:
  workflow_call:       # release.yml runs it before it publishes anything

permissions:
  contents: read

concurrency:
  group: chart-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind:
    name: the chart on kind
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Room on the disk for the image, its copy inside the cluster and the node image
        run: |
          df -h /
          # toolchains this job never uses; the runner is thrown away afterwards
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af > /dev/null
          df -h /
      - uses: docker/setup-buildx-action@v4
      - name: App image, loaded into this runner's Docker (the ci workflow's build cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          load: true
          tags: offerowl-app:e2e
          cache-from: type=gha,scope=app
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.4
      - name: kind, checked against the checksum of its release
        run: |
          curl -fsSL -o /tmp/kind https://github.com/kubernetes-sigs/kind/releases/download/v0.29.0/kind-linux-amd64
          echo "c72eda46430f065fb45c5f70e7c957cc9209402ef309294821978677c8fb3284  /tmp/kind" | sha256sum -c -
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
      - name: Install the chart on a throwaway cluster and check it
        run: tests/packaging/chart_e2e.sh offerowl-app:e2e
