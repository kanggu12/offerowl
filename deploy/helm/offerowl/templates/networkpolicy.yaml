{{- if .Values.networkPolicy.enabled }}
# No pod may open a connection to the panel, which has no login. kubectl port-forward and the kubelet's probes reach the
# pod from the node and are not affected. The chart's own test pod (helm test) is let in, and so is whatever
# networkPolicy.allowFrom lists (the Ingress controller). The pod's own connections out (the model server) stay open.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "offerowl.fullname" . }}
  labels:
    {{- include "offerowl.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "offerowl.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "offerowl.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: test
        {{- with .Values.networkPolicy.allowFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
