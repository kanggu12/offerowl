{{- $h := dict -}}
{{- $_ := include "offerowl.instances" (dict "root" . "holder" $h) -}}
{{- range $c := $h.instances }}
{{- with $c }}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
---
# The data folder{{ if .Tenant }} of {{ .Tenant }}{{ end }}: settings, the workspace (profile, jobs, documents) and the logs.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "offerowl.claimName" . }}
  labels:
    {{- include "offerowl.labels" . | nindent 4 }}
  annotations:
    # helm uninstall leaves your documents behind. Delete the claim with kubectl to remove them.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- with (include "offerowl.storageClass" .Values.persistence) }}
  {{- . | nindent 2 }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
{{- end }}
{{- end }}
